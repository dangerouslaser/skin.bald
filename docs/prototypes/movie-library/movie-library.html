<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap');
#bald-library{font-family:'Instrument Sans',sans-serif;background:#0b0c10;color:#eceef2;position:relative;isolation:isolate;overflow:hidden;padding:5%;box-sizing:border-box;min-height:520px}
#bald-library *{box-sizing:border-box}
#bald-library .backdrop{position:absolute;inset:-60px;z-index:-1;background-size:cover;background-position:center;filter:blur(35px) brightness(.3);transition:background-image .8s}
#bald-library header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:36px;gap:20px}
#bald-library h1{font-size:28px;font-weight:500;margin:0}
#bald-library .muted{color:#eceef299;font-size:13px}
#bald-library .layout{display:grid;grid-template-columns:2fr 1fr;gap:5%}
#bald-library .posters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-content:start}
#bald-library button{font:inherit;color:inherit;border:0;background:none;padding:0;text-align:left}
#bald-library .poster img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;border-radius:3px;opacity:.55;transition:opacity .25s,transform .28s cubic-bezier(.175,.885,.32,1.275)}
#bald-library .poster[aria-pressed=true] img{opacity:1;outline:2px solid #eceef2;outline-offset:4px;transform:scale(1.025)}
#bald-library .poster span{display:block;font-size:13px;line-height:1.4;margin-top:14px;color:#eceef2b3}
#bald-library .preview{aspect-ratio:16/9;background:#171a20;overflow:hidden;margin-bottom:26px;position:relative}
#bald-library .preview img{width:100%;height:100%;object-fit:cover;animation:bald-art 1.5s cubic-bezier(.215,.61,.355,1)}
#bald-library h2{font-size:25px;line-height:1.1;font-weight:600;margin:0 0 14px}
#bald-library .meta{font-size:13px;color:#eceef2cc;margin:0 0 10px}
#bald-library .genre{font-size:12px;font-weight:600;color:#9fb0c6;margin:0 0 18px}
#bald-library .plot{font-size:14px;line-height:1.55;color:#eceef2c2;margin:0}
#bald-library .caption{animation:bald-caption .54s cubic-bezier(.215,.61,.355,1)}
#bald-library footer{display:flex;justify-content:space-between;gap:16px;margin-top:52px;font-size:12px;color:#eceef299}
#bald-library .detail{margin-top:24px;padding:9px 16px;border:1px solid #eceef280;border-radius:24px;font-size:13px}
#bald-library .info{display:none}
#bald-library[data-info=true] .info{display:block}
#bald-library[data-info=true] .layout{display:none}
#bald-library .info h2{font-size:36px;max-width:600px}
#bald-library .info p{max-width:560px;line-height:1.6}
@keyframes bald-art{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:scale(1)}}
@keyframes bald-caption{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:600px){#bald-library{min-height:0;padding:24px}#bald-library .layout{grid-template-columns:1fr;gap:28px}#bald-library header{margin-bottom:26px}#bald-library .preview{display:none}#bald-library h2{font-size:23px}#bald-library footer{flex-wrap:wrap;margin-top:30px}}
@media(prefers-reduced-motion:reduce){#bald-library *{animation:none!important;transition:none!important}}
</style>
<div id="bald-library" aria-label="Bald movie library concept">
 <div class="backdrop"></div>
 <header><h1>Movies</h1><span class="muted">All movies · Title A–Z</span></header>
 <div class="layout">
  <div class="posters" aria-label="Movies"></div>
  <aside aria-live="polite"><div class="preview"></div><div class="caption"></div><button type="button" class="detail cursor-interaction">Open details</button></aside>
 </div>
 <section class="info" aria-live="polite"><h2></h2><p></p><button type="button" class="detail back cursor-interaction">Back to library</button></section>
 <footer><span class="count"></span><span>← → Browse &nbsp; · &nbsp; Enter for details</span></footer>
</div>

};
const movies=[
{key:'fast',title:'2 Fast 2 Furious',year:'2003',time:'1h 47m',genre:'Action / Crime / Thriller',plot:'Former police officer Brian O’Conner teams up with his ex-con friend Roman Pearce to infiltrate a Miami drug operation.'},
{key:'cold',title:'3 Cold Dishes',year:'2025',time:'1h 55m',genre:'Action / Thriller / Drama',plot:'Three women trafficked as teenagers reunite seventeen years later to confront the powerful men behind their pain.'},
{key:'dragon',title:'Legend of the White Dragon',year:'2026',time:'1h 37m',genre:'Action / Fantasy',plot:'Forced to hide in the shadows, fugitive hero Erik Reed must clear his name to reunite with his family. Standing in his way is a mysterious villain.'}
];
const state={selected:0,artwork:true};
const saved=window.openai?.widgetState?.modelContent;
if(saved&&Number.isInteger(saved.selected))state.selected=Math.max(0,Math.min(2,saved.selected));
function save(){window.openai?.setWidgetState?.({modelContent:{selected:state.selected,artwork:state.artwork},privateContent:null})?.catch(()=>{});}
const grid=root.querySelector('.posters');
movies.forEach((movie,index)=>{const button=document.createElement('button');button.type='button';button.className='poster cursor-interaction';button.setAttribute('aria-label',movie.title);button.innerHTML='<img alt=""><span></span>';button.querySelector('img').src=assets[movie.key+'Poster'];button.querySelector('span').textContent=movie.title;button.addEventListener('click',()=>{state.selected=index;render();save();});grid.append(button);});
function render(){const movie=movies[state.selected];root.querySelector('.backdrop').style.backgroundImage=`url("${assets[movie.key+'Fanart']}")`;[...grid.children].forEach((button,index)=>button.setAttribute('aria-pressed',index===state.selected));const preview=root.querySelector('.preview');preview.style.display=state.artwork?'':'none';preview.replaceChildren();const image=new Image();image.src=assets[movie.key+'Fanart'];image.alt=movie.title+' artwork';preview.append(image);const old=root.querySelector('.caption'),caption=old.cloneNode(false);caption.innerHTML='<h2></h2><p class="meta"></p><p class="genre"></p><p class="plot"></p>';caption.querySelector('h2').textContent=movie.title;caption.querySelector('.meta').textContent=movie.year+', '+movie.time;caption.querySelector('.genre').textContent=movie.genre;caption.querySelector('.plot').textContent=movie.plot;old.replaceWith(caption);root.querySelector('.count').textContent=(state.selected+1)+' / 3 · Sample library';root.querySelector('.info h2').textContent=movie.title;root.querySelector('.info p').textContent=movie.plot;}
function open(){root.dataset.info='true';root.querySelector('.back').focus();}
root.querySelector('aside .detail').addEventListener('click',open);
root.querySelector('.back').addEventListener('click',()=>{root.dataset.info='false';grid.children[state.selected].focus();});
root.addEventListener('keydown',event=>{if(root.dataset.info==='true'){if(event.key==='Escape'){root.dataset.info='false';grid.children[state.selected].focus();}return;}if(event.key==='ArrowRight'||event.key==='ArrowLeft'){event.preventDefault();state.selected=Math.max(0,Math.min(movies.length-1,state.selected+(event.key==='ArrowRight'?1:-1)));render();grid.children[state.selected].focus();save();}else if(event.key==='Enter'&&event.target.closest('.poster')){event.preventDefault();open();}});
window.addEventListener('openai:set_globals',event=>{const value=event.detail?.globals?.widgetState?.modelContent;if(value&&Number.isInteger(value.selected)){state.selected=Math.max(0,Math.min(2,value.selected));render();}});
render();
if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:()=>{render();save();}});tweak.addToggle(state,'artwork',{label:'Selected artwork preview'});}
})();
</script>
